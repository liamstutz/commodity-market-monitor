name: Update data and publish dashboard

on:
  schedule:
    - cron: "30 22 * * 1-5"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "pipeline/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/update.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      fetch_outcome: ${{ steps.fetch.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate research rules
        run: python -m unittest discover -s tests -v
      - name: Refresh market data
        id: fetch
        continue-on-error: true
        run: python pipeline/fetch.py
      - name: Record eligible forecasts and build dashboard
        run: python pipeline/build.py --record
      - name: Preserve refreshed data and forecast journal
        run: |
          git config user.name "market-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "data: automated refresh $(date -u +%F)"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Flag a complete source outage
        if: needs.update.outputs.fetch_outcome == 'failure'
        run: |
          echo "::error::All sources failed. The dashboard was published with cached data and visible source warnings."
          exit 1
