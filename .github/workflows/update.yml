name: Update data and publish dashboard

on:
  schedule:
    - cron: "30 22 * * 1-5"   # weekdays 22:30 UTC, after US markets and EIA releases
  push:
    branches: [main]
    paths: ["calls/**", "notes/**", "site/**", "pipeline/**"]
  workflow_dispatch:           # "Run workflow" button in the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history: call timestamps come from git

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch market data
        run: python pipeline/fetch.py

      - name: Grade calls and build site
        run: python pipeline/build.py

      - name: Commit refreshed data
        run: |
          git config user.name  "market-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: update $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
