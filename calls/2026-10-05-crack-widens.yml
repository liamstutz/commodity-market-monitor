thesis: >
  I expect the NY Harbor 3-2-1 crack spread to widen by at least $2/bbl
  by October 16 as lower refinery throughput limits product supply:
  EIA reports crude runs fell 554,000 b/d to 16.257 million b/d in the
  week ended September 25. Gasoline and distillate inventories both drew
  while commercial crude stocks built, supporting products relative to
  crude; this is an inference from the physical balance, not a consensus
  forecast. The latest available spread is $67.038/bbl on September 29,
  but the grader will use the last observation before the effective call
  date as data fill in. A rebound in refinery runs accompanied by product
  inventory builds, or crude rising faster than products, would undermine
  the thesis; confidence is moderate given the reporting lag.
